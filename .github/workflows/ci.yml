name: Validate LeadTrace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Match packageManager: newer bundled npm changes optional-peer lock resolution.
      - run: npx --yes npm@11.9.0 --version
      - run: npx --yes npm@11.9.0 ci --ignore-scripts
      - run: npm run db:isolated
      - run: git diff --exit-code -- supabase/isolated-schema.sql supabase/bootstrap-isolated.sql
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
